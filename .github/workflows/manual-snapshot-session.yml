name: Run Manual Snapshot Session

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Total session duration in minutes (1-300)"
        required: true
        default: "15"
        type: string
      snapshot_count:
        description: "Number of snapshots to collect (1-60)"
        required: true
        default: "15"
        type: string

permissions:
  contents: write

concurrency:
  group: currency-pulse-data-writes
  cancel-in-progress: false

jobs:
  collect-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DURATION_MINUTES: ${{ inputs.duration_minutes }}
      SNAPSHOT_COUNT: ${{ inputs.snapshot_count }}
      DATA_RELEASE_TAG: data-live
      SNAPSHOT_DATA_DIRECTORY: .runtime/data
      SNAPSHOT_ARCHIVE_DIRECTORY: .runtime/snapshots

    steps:
      - name: Validate session settings
        run: |
          if [[ ! "$DURATION_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "duration_minutes must be a whole number from 1 to 300."
            exit 1
          fi

          if [[ ! "$SNAPSHOT_COUNT" =~ ^[0-9]+$ ]]; then
            echo "snapshot_count must be a whole number from 1 to 60."
            exit 1
          fi

          DURATION_VALUE=$((10#$DURATION_MINUTES))
          SNAPSHOT_VALUE=$((10#$SNAPSHOT_COUNT))

          if (( DURATION_VALUE < 1 || DURATION_VALUE > 300 )); then
            echo "duration_minutes must be from 1 to 300."
            exit 1
          fi

          if (( SNAPSHOT_VALUE < 1 || SNAPSHOT_VALUE > 60 )); then
            echo "snapshot_count must be from 1 to 60."
            exit 1
          fi

      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore live runtime data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$SNAPSHOT_DATA_DIRECTORY" .release-download

          if gh release view "$DATA_RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$DATA_RELEASE_TAG" --pattern latest.json --dir .release-download
            gh release download "$DATA_RELEASE_TAG" --pattern history.json --dir .release-download
          fi

          cp public/data/latest.json "$SNAPSHOT_DATA_DIRECTORY/latest.json"
          cp public/data/history.json "$SNAPSHOT_DATA_DIRECTORY/history.json"

          if [[ -f .release-download/latest.json ]]; then
            cp .release-download/latest.json "$SNAPSHOT_DATA_DIRECTORY/latest.json"
          fi

          if [[ -f .release-download/history.json ]]; then
            cp .release-download/history.json "$SNAPSHOT_DATA_DIRECTORY/history.json"
          fi

      - name: Collect evenly spaced snapshots
        run: |
          DURATION_VALUE=$((10#$DURATION_MINUTES))
          SNAPSHOT_VALUE=$((10#$SNAPSHOT_COUNT))
          SESSION_START=$(date +%s)
          TOTAL_SECONDS=$((DURATION_VALUE * 60))

          echo "Collecting $SNAPSHOT_VALUE snapshots across $DURATION_VALUE minutes."

          for ((INDEX = 1; INDEX <= SNAPSHOT_VALUE; INDEX++)); do
            echo "Collecting snapshot $INDEX of $SNAPSHOT_VALUE..."
            npm run snapshot

            if (( INDEX < SNAPSHOT_VALUE )); then
              NEXT_TARGET=$((SESSION_START + (INDEX * TOTAL_SECONDS) / (SNAPSHOT_VALUE - 1)))

              NOW=$(date +%s)
              WAIT_SECONDS=$((NEXT_TARGET - NOW))

              if (( WAIT_SECONDS > 0 )); then
                echo "Waiting $WAIT_SECONDS seconds for the next evenly spaced snapshot..."
                sleep "$WAIT_SECONDS"
              fi
            fi
          done

      - name: Publish completed snapshot session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .release-upload
          cp "$SNAPSHOT_DATA_DIRECTORY/history.json" .release-upload/history.json
          cp "$SNAPSHOT_DATA_DIRECTORY/latest.json" .release-upload/latest.json

          if ! gh release view "$DATA_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$DATA_RELEASE_TAG" \
              --target "${{ github.event.repository.default_branch }}" \
              --title "Currency Pulse live data" \
              --notes "Machine-generated runtime data for the Currency Pulse dashboard." \
              --latest=false
          fi

          gh release upload "$DATA_RELEASE_TAG" \
            .release-upload/history.json \
            .release-upload/latest.json \
            --clobber

          echo "Published $SNAPSHOT_COUNT snapshots without creating repository commits."
